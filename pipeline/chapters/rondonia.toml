slug = "rondonia"
collections = ["NISAR_L2_GCOV_V1", "NISAR_L2_GCOV_PROVISIONAL_V1", "NISAR_L2_GCOV_BETA_V1"]  # best maturity first
product = "GCOV"

[windows]
before = ["2026-06-17", "2026-07-11"]
after = ["2026-09-09", "2026-10-03"]

[series]
start = "2026-06-17"
count = 10

[processing]
max_dates = 8
drop_threshold_db = 3.0   # HV before minus after, dB
min_before_db = -15.0     # pixel must start as forest: real HV is bimodal, pasture -17 to -21 dB, forest -10 to -12 dB
mmu_ha = 1.0
stretch_hh = [-20.0, 0.0]
stretch_hv = [-28.0, -8.0]
stretch_ratio = [0.0, 15.0]

[discover]
min_coverage = 0.9  # share of the study area a granule footprint must cover

[real]
area_key = "cleared_ha"
area_label = "Forest cleared"
series_kind = "hv"                       # HV in the loss mask, date by date
series_id = "hv_cleared"
series_label = "HV backscatter in cleared pixels"
reference_label = "Intact forest"

[[annotations]]
id = "new_clearing"
label = "New clearing"
kind = "patch_area"

[[optical]]
id = "optical_before"
label = "Optical, before"
mode = "median"
window = ["2026-06-17", "2026-07-11"]

[[optical]]
id = "optical_after"
label = "Optical, after"
mode = "median"
window = ["2026-09-09", "2026-10-03"]

[fixture]
pattern = "fishbone"
seed = 1101
max_px = 640

[flyover]
duration = 20  # Act I; the last waypoint is the chapter's openingCamera (pitch 52)
exaggeration = 1.5

[[flyover.waypoints]]
t = 0
center = [-63.350, -10.050]
zoom = 8.9
pitch = 0
bearing = 0

[[flyover.waypoints]]
t = 7
center = [-63.420, -9.980]
zoom = 9.8
pitch = 45
bearing = -20

[[flyover.waypoints]]
t = 14
center = [-63.500, -9.880]
zoom = 10.6
pitch = 55
bearing = -10

[[flyover.waypoints]]
t = 20
center = [-63.530, -9.850]
zoom = 11.3
pitch = 52
bearing = -15
