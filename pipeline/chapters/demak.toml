slug = "demak"
collections = ["NISAR_L2_GCOV_V1", "NISAR_L2_GCOV_PROVISIONAL_V1", "NISAR_L2_GCOV_BETA_V1"]  # best maturity first
product = "GCOV"
bbox = [110.4, -7.05, 110.75, -6.75]   # study area [west, south, east, north]; the chapter manifest takes over once one exists

[windows]
before = ["2026-06-17", "2026-07-11"]
after = ["2026-09-09", "2026-10-03"]

[series]
start = "2026-06-17"
count = 10

[processing]
max_dates = 8
drop_threshold_db = 3.0   # HV before minus after, dB
min_before_db = -15.0     # pixel must start as vegetation
mmu_ha = 1.0
stretch_hh = [-20.0, 0.0]
stretch_hv = [-28.0, -8.0]
stretch_ratio = [0.0, 15.0]

[discover]
min_coverage = 0.9  # share of the study area a granule footprint must cover

[real]
mode = "imagery"                 # no defensible NISAR change here (rice cycle); numbers come from cited facts
footprint_fact = "land_lost_ha"   # the city-scale square uses this cited area

[[optical]]
id = "optical_baseline"
label = "Optical, dry season 2017"
mode = "median"
window = ["2017-08-01", "2017-11-15"]

[[optical]]
id = "optical_2026"
label = "Optical, dry season 2026"
mode = "median"
window = ["2026-06-01", "2026-10-15"]

[flyover]
duration = 20  # Act I; the last waypoint is the chapter's openingCamera (pitch 52)
exaggeration = 1.5

[[flyover.waypoints]]
t = 0
center = [110.575, -6.900]
zoom = 9.6
pitch = 0
bearing = 0

[[flyover.waypoints]]
t = 7
center = [110.540, -6.910]
zoom = 10.4
pitch = 45
bearing = 15

[[flyover.waypoints]]
t = 14
center = [110.510, -6.920]
zoom = 11.2
pitch = 55
bearing = 20

[[flyover.waypoints]]
t = 20
center = [110.500, -6.925]
zoom = 11.9
pitch = 52
bearing = 15
