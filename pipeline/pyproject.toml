[project]
name = "sarstory"
version = "0.1.0"
description = "Offline pipeline for Dancing with the SARs: NISAR search and clipping, COG writing, chapter manifests, flyover rendering."
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "rasterio>=1.4.3",
    "h5py>=3.12",
    "earthaccess>=0.14",
    "pystac-client>=0.9",
    "planetary-computer>=1.0",
    "jsonschema>=4.23",
    "pillow>=11",
]

[project.optional-dependencies]
flyover = ["pyvista>=0.44", "imageio-ffmpeg>=0.5"]

[project.scripts]
sar = "sarstory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarstory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
