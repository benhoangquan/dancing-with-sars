slug = "okanagan"
collections = ["NISAR_L2_GCOV_V1", "NISAR_L2_GCOV_PROVISIONAL_V1", "NISAR_L2_GCOV_BETA_V1"]  # best maturity first
product = "GCOV"

[windows]
before = ["2026-06-17", "2026-07-11"]
after = ["2026-09-09", "2026-10-03"]
smoke_scene = "2026-08-16"

[series]
start = "2026-06-17"
count = 10

[processing]
max_dates = 8
drop_threshold_db = 2.0   # fire: smaller drop than clearing, dB
min_before_db = -16.0
mmu_ha = 1.0
stretch_hh = [-20.0, 0.0]
stretch_hv = [-28.0, -8.0]
stretch_ratio = [0.0, 15.0]

[discover]
min_coverage = 0.9  # share of the study area a granule footprint must cover

[perimeter]   # measured inside a mapped fire perimeter (nisar/perimeter.py), not per pixel
fire_number = "K51402"
fire_name = "Quilpituk Creek"
started = "2026-08-02"          # BC Wildfire Service discovery date
mapped = "2026-08-21"           # date of the final mapped perimeter
wfs = "https://openmaps.gov.bc.ca/geo/pub/wfs"
layer = "pub:WHSE_LAND_AND_NATURAL_RESOURCE.PROT_CURRENT_FIRE_POLYS_SP"
incident_url = "https://wildfiresituation.nrs.gov.bc.ca/incidents?fireYear=2026&incidentNumber=K51402"
catalog_url = "https://catalogue.data.gov.bc.ca/dataset/bc-wildfire-fire-perimeters-current"

[[optical]]
id = "optical_baseline"
label = "Optical, summer 2025"
mode = "median"
window = ["2025-07-01", "2025-08-31"]

[[optical]]
id = "optical_smoke"
label = "Optical, during the fire"
mode = "scene"
date = "2026-08-16"

[[optical]]
id = "optical_after"
label = "Optical, after the fire"
mode = "median"
window = ["2026-09-01", "2026-10-15"]

[impact]   # Layer 1: buildings near the Quilpituk Creek perimeter (sar overture)
area = [-119.62, 50.02, -119.44, 50.14]
buildings = true
near_m = 2000

[soundscape]   # Layer 5 (sar audio): forest, then wind and fire (synthesized: Commons had no free fire recording)
before = { commons = "File:20090610 0 ambience.ogg", start_s = 35, label = "Forest birds" }
after = { synth = "fire", label = "Wind and fire" }

[flyover]
duration = 20  # Act I; the last waypoint is the chapter's openingCamera (pitch 52)
exaggeration = 2.0

[[flyover.waypoints]]
t = 0
center = [-119.500, 50.000]
zoom = 9.0
pitch = 0
bearing = 0

[[flyover.waypoints]]
t = 7
center = [-119.520, 50.030]
zoom = 9.9
pitch = 45
bearing = -15

[[flyover.waypoints]]
t = 14
center = [-119.530, 50.060]
zoom = 10.8
pitch = 55
bearing = -25

[[flyover.waypoints]]
t = 20
center = [-119.530, 50.080]
zoom = 11.6
pitch = 52
bearing = -20
