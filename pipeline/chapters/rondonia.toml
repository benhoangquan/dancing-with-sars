slug = "rondonia"
collections = ["NISAR_L2_GCOV_V1", "NISAR_L2_GCOV_PROVISIONAL_V1", "NISAR_L2_GCOV_BETA_V1"]  # best maturity first
product = "GCOV"

[windows]
before = ["2026-06-17", "2026-07-11"]
after = ["2026-09-09", "2026-10-03"]

[series]
start = "2026-06-17"
count = 10

[processing]
max_dates = 8
drop_threshold_db = 3.0   # HV before minus after, dB
min_before_db = -15.0     # pixel must start as forest: real HV is bimodal, pasture -17 to -21 dB, forest -10 to -12 dB
mmu_ha = 1.0
stretch_hh = [-20.0, 0.0]
stretch_hv = [-28.0, -8.0]
stretch_ratio = [0.0, 15.0]

[discover]
min_coverage = 0.9  # share of the study area a granule footprint must cover

[real]
area_key = "cleared_ha"
area_label = "Forest cleared"
series_kind = "hv"                       # HV in the loss mask, date by date
series_id = "hv_cleared"
series_label = "HV backscatter in cleared pixels"
reference_label = "Intact forest"

[[annotations]]
id = "new_clearing"
label = "New clearing"
kind = "patch_area"

[[optical]]
id = "optical_before"
label = "Optical, before"
mode = "median"
window = ["2026-06-17", "2026-07-11"]

[[optical]]
id = "optical_after"
label = "Optical, after"
mode = "median"
window = ["2026-09-09", "2026-10-03"]

[fixture]
pattern = "fishbone"
seed = 1101
max_px = 640

[flyover]
duration = 36
exaggeration = 1.5

[[flyover.waypoints]]
t = 0
center = [-63.35, -10.05]
zoom = 8.9
pitch = 0
bearing = 0

[[flyover.waypoints]]
t = 8
center = [-63.45, -10.12]
zoom = 9.9
pitch = 58
bearing = -28

[[flyover.waypoints]]
